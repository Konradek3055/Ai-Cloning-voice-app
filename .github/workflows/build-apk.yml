name: Build KinoTTS Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinotts-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and verify ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Verify APK package, min SDK and native ABI
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-info.txt
          grep -q "package: name='pl.kinotts.studio'" apk-info.txt
          grep -q "sdkVersion:'28'" apk-info.txt
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/.*\.so$'
          echo "Verified APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KinoTTS-Studio-debug-APK-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KinoTTS-Studio-build-diagnostics
          path: |
            build.log
            apk-info.txt
          if-no-files-found: ignore
          retention-days: 14
